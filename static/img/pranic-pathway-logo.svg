<svg
  viewBox="0 0 360 80"
  xmlns="http://www.w3.org/2000/svg"
  style="width:100%; height:auto; display:block; background:transparent;"
>
  <!-- Energy circles (aura) -->
  <circle cx="40" cy="40" r="28" fill="none" stroke="#2E8B57" stroke-width="2" opacity="0.3"/>
  <circle cx="40" cy="40" r="20" fill="none" stroke="#32CD32" stroke-width="2" opacity="0.5"/>
  <circle cx="40" cy="40" r="13" fill="none" stroke="#90EE90" stroke-width="2" opacity="0.7"/>
  
  <!-- Central lotus/chakra symbol -->
  <circle cx="40" cy="40" r="8" fill="#2E8B57"/>
  <path d="M40 30 L46 40 L40 50 L34 40 Z" fill="#90EE90"/>
  <circle cx="40" cy="40" r="3" fill="#FFFFFF"/>
  
  <!-- Energy lines -->
  <line x1="65" y1="28" x2="85" y2="28" stroke="#2E8B57" stroke-width="2"/>
  <line x1="65" y1="40" x2="85" y2="40" stroke="#32CD32" stroke-width="2"/>
  <line x1="65" y1="52" x2="85" y2="52" stroke="#90EE90" stroke-width="2"/>
  
  <!-- Text -->
  <text
    x="95"
    y="42"
    font-family="Arial, sans-serif"
    font-size="22"
    font-weight="bold"
    fill="#2E8B57"
